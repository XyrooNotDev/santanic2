name: Build Santanic Build APK Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # --- TAMBAHKAN LANGKAH INI UNTUK MEMBUAT GRADLEW OTOMATIS ---
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.9
      # (Jika gradle belum terinstal di runner, perintah ini akan mengunduhnya)

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SantanicBuild-Release-APK
        path: app/build/outputs/apk/release/*.apk
